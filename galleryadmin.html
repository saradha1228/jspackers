<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Admin — JS Packers and Movers</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #eef0f8; color: #333; min-height: 100vh; }

    /* ---- HEADER ---- */
    .admin-header {
      background: #1e2d6e;
      color: #fff;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.18);
    }
    .admin-header .brand { display: flex; align-items: center; gap: 12px; }
    .admin-header .brand img { height: 38px; filter: brightness(0) invert(1); }
    .admin-header .brand-text small { font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.65; display: block; }
    .admin-header .brand-text strong { font-size: 1rem; font-weight: 700; }
    .admin-header .header-links { display: flex; gap: 20px; align-items: center; }
    .admin-header .header-links a { color: rgba(255,255,255,0.8); font-size: 0.88rem; display: flex; align-items: center; gap: 6px; transition: color 0.2s; text-decoration: none; }
    .admin-header .header-links a:hover { color: #fff; }
    .badge-live { background: #cc1f1f; color: #fff; font-size: 0.65rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; }

    /* ---- MAIN ---- */
    .admin-main { max-width: 1140px; margin: 0 auto; padding: 36px 24px 60px; }

    /* ---- UPLOAD ZONE ---- */
    .upload-zone {
      background: #fff;
      border: 2.5px dashed #b0bad9;
      border-radius: 18px;
      padding: 52px 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      margin-bottom: 28px;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: #1e2d6e;
      background: #f4f6fc;
    }
    .upload-zone .upload-icon { font-size: 2.8rem; color: #1e2d6e; margin-bottom: 14px; }
    .upload-zone h3 { font-size: 1.15rem; color: #1e2d6e; font-weight: 700; margin-bottom: 6px; }
    .upload-zone p { color: #888; font-size: 0.88rem; }
    .upload-zone input[type="file"] { display: none; }
    .btn-pick {
      display: inline-block;
      background: #1e2d6e;
      color: #fff;
      padding: 11px 30px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 18px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-pick:hover { background: #161f4e; }

    /* ---- STATS BAR ---- */
    .stats-bar {
      background: #fff;
      border-radius: 14px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
      box-shadow: 0 2px 12px rgba(30,45,110,0.07);
      flex-wrap: wrap;
    }
    .stats-bar .count-pill { background: #eef0f8; border-radius: 8px; padding: 8px 18px; font-size: 0.9rem; font-weight: 600; color: #1e2d6e; white-space: nowrap; }
    .stats-bar .count-pill span { color: #cc1f1f; font-size: 1.15rem; }
    .storage-wrap { flex: 1; min-width: 160px; }
    .storage-label { font-size: 0.76rem; color: #999; margin-bottom: 6px; }
    .storage-track { height: 7px; background: #e0e4f0; border-radius: 6px; overflow: hidden; }
    .storage-fill { height: 100%; background: #1e2d6e; border-radius: 6px; transition: width 0.4s; }
    .storage-fill.warn { background: #cc1f1f; }
    .btn-clear-all {
      background: none;
      border: 1.5px solid #cc1f1f;
      color: #cc1f1f;
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-clear-all:hover { background: #cc1f1f; color: #fff; }

    /* ---- IMAGE GRID ---- */
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }

    .img-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(30,45,110,0.07);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .img-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(30,45,110,0.13); }

    .img-card .thumb { position: relative; aspect-ratio: 4/3; overflow: hidden; background: #eef0f8; }
    .img-card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-card .del-btn {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(204,31,31,0.88);
      color: #fff;
      border: none;
      width: 30px; height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .img-card:hover .del-btn { opacity: 1; }

    .img-card .card-body { padding: 12px 14px 14px; }
    .img-card .alt-input {
      width: 100%;
      border: 1.5px solid #e0e4f0;
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 0.78rem;
      color: #444;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .img-card .alt-input:focus { border-color: #1e2d6e; }
    .img-card .card-date { font-size: 0.68rem; color: #bbb; margin-top: 6px; }

    /* ---- EMPTY STATE ---- */
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 72px 0; color: #c0c8e0; }
    .empty-state i { font-size: 3.5rem; margin-bottom: 16px; display: block; }
    .empty-state p { font-size: 1rem; line-height: 1.7; }

    /* ---- PROCESSING OVERLAY ---- */
    #procOverlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(30,45,110,0.45);
      z-index: 200;
      align-items: center; justify-content: center;
    }
    #procOverlay.show { display: flex; }
    .proc-box { background: #fff; border-radius: 16px; padding: 44px 60px; text-align: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e0e4f0; border-top-color: #1e2d6e; border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .proc-box p { margin-top: 18px; color: #666; font-size: 0.95rem; }

    /* ---- TOAST ---- */
    #toast {
      position: fixed; bottom: 28px; right: 28px;
      background: #1e2d6e; color: #fff;
      padding: 13px 22px; border-radius: 10px;
      font-size: 0.88rem; font-weight: 500;
      box-shadow: 0 8px 28px rgba(0,0,0,0.18);
      transform: translateY(70px); opacity: 0;
      transition: all 0.3s ease; z-index: 300;
      max-width: 320px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.ok  { background: #1a7a1a; }
    #toast.err { background: #cc1f1f; }

    @media (max-width: 600px) {
      .admin-header { padding: 12px 16px; }
      .admin-main { padding: 20px 12px 48px; }
      .upload-zone { padding: 36px 16px; }
      .admin-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="admin-header">
  <div class="brand">
    <img src="images/logo.png" alt="Logo">
    <div class="brand-text">
      <small>JS Packers and Movers</small>
      <strong>Gallery Admin</strong>
    </div>
  </div>
  <div class="header-links">
    <a href="gallery.html" target="_blank"><i class="fa-solid fa-images"></i> View Gallery <span class="badge-live">Live</span></a>
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Site</a>
  </div>
</header>

<!-- MAIN -->
<main class="admin-main">

  <!-- Upload zone -->
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
    <h3>Drag &amp; drop images here</h3>
    <p>JPG, PNG, WEBP &nbsp;•&nbsp; Multiple files at once</p>
    <label for="fileInput" class="btn-pick"><i class="fa-solid fa-folder-open"></i>&nbsp; Choose Images</label>
  </div>

  <!-- Stats bar -->
  <div class="stats-bar">
    <div class="count-pill">Photos: <span id="imgCount">0</span></div>
    <div class="storage-wrap">
      <div class="storage-label">Storage: <strong id="storageUsed">0 KB</strong> used (browser limit ~5 MB)</div>
      <div class="storage-track"><div class="storage-fill" id="storageFill" style="width:0%"></div></div>
    </div>
    <button class="btn-clear-all" id="clearBtn"><i class="fa-solid fa-trash"></i> Clear All</button>
  </div>

  <!-- Grid -->
  <div class="admin-grid" id="adminGrid"></div>

</main>

<!-- Processing overlay -->
<div id="procOverlay">
  <div class="proc-box">
    <div class="spinner"></div>
    <p id="procText">Processing…</p>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const KEY      = 'jspackersGallery';
const MAX_W    = 1200;
const MAX_H    = 900;
const QUALITY  = 0.78;

/* ---- storage helpers ---- */
function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch { return []; }
}
function save(arr) {
  try { localStorage.setItem(KEY, JSON.stringify(arr)); return true; }
  catch (e) {
    toast(e.name === 'QuotaExceededError'
      ? 'Storage full! Delete some images first.' : 'Save failed.', 'err');
    return false;
  }
}

/* ---- toast ---- */
let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ---- stats ---- */
function updateStats() {
  const images = load();
  document.getElementById('imgCount').textContent = images.length;
  const bytes = (localStorage.getItem(KEY) || '').length;
  const kb = bytes / 1024;
  document.getElementById('storageUsed').textContent =
    kb >= 1024 ? (kb / 1024).toFixed(2) + ' MB' : kb.toFixed(1) + ' KB';
  const pct = Math.min(100, (bytes / (5 * 1024 * 1024)) * 100);
  const fill = document.getElementById('storageFill');
  fill.style.width = pct.toFixed(1) + '%';
  fill.classList.toggle('warn', pct > 75);
}

/* ---- render grid ---- */
function renderGrid() {
  const grid = document.getElementById('adminGrid');
  const images = load();
  grid.innerHTML = '';

  if (!images.length) {
    grid.innerHTML = `<div class="empty-state">
      <i class="fa-regular fa-images"></i>
      <p>No images yet.<br>Upload photos above — they'll appear live on the website.</p>
    </div>`;
    updateStats();
    return;
  }

  images.forEach(img => {
    const card = document.createElement('div');
    card.className = 'img-card';
    card.innerHTML = `
      <div class="thumb">
        <img src="${img.src}" alt="${img.alt}" loading="lazy">
        <button class="del-btn" data-id="${img.id}" title="Delete image"><i class="fa-solid fa-trash"></i></button>
      </div>
      <div class="card-body">
        <input class="alt-input" type="text" value="${img.alt}" placeholder="Image description…" data-id="${img.id}">
        <div class="card-date">Added ${fmtDate(img.addedAt)}</div>
      </div>`;
    grid.appendChild(card);
  });

  /* delete */
  grid.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('Remove this image from the gallery?')) return;
      save(load().filter(i => i.id !== btn.dataset.id));
      renderGrid();
      toast('Image removed.');
    });
  });

  /* inline alt-text edit */
  grid.querySelectorAll('.alt-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const arr = load();
      const item = arr.find(i => i.id === inp.dataset.id);
      if (item) { item.alt = inp.value; save(arr); }
    });
  });

  updateStats();
}

/* ---- date helper ---- */
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

/* ---- compress image via canvas ---- */
function compress(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
        if (h > MAX_H) { w = Math.round(w * MAX_H / h); h = MAX_H; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', QUALITY));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---- process file list ---- */
async function processFiles(files) {
  const imgs = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;

  const overlay  = document.getElementById('procOverlay');
  const procText = document.getElementById('procText');
  overlay.classList.add('show');

  const arr = load();
  let added = 0;

  for (let i = 0; i < imgs.length; i++) {
    procText.textContent = `Compressing ${i + 1} of ${imgs.length}…`;
    const src  = await compress(imgs[i]);
    const name = imgs[i].name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
    arr.unshift({
      id:      Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      src,
      alt:     name.charAt(0).toUpperCase() + name.slice(1),
      addedAt: Date.now()
    });
    added++;
  }

  overlay.classList.remove('show');
  if (save(arr)) {
    renderGrid();
    toast(`${added} image${added !== 1 ? 's' : ''} added to gallery!`);
  }
}

/* ---- upload zone events ---- */
const zone  = document.getElementById('uploadZone');
const input = document.getElementById('fileInput');

input.addEventListener('change', e => { if (e.target.files.length) processFiles(e.target.files); input.value = ''; });
zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', ()  => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) processFiles(e.dataTransfer.files);
});

/* ---- clear all ---- */
document.getElementById('clearBtn').addEventListener('click', () => {
  if (!load().length) { toast('Gallery is already empty.', 'err'); return; }
  if (!confirm('Remove ALL uploaded images from the gallery? This cannot be undone.')) return;
  localStorage.removeItem(KEY);
  renderGrid();
  toast('All images cleared.', 'err');
});

/* ---- auth guard ---- */
if (sessionStorage.getItem('adminAuth') !== 'true') {
  window.location.replace('galleryaccess.html');
}

/* ---- logout ---- */
document.querySelector('.header-links a[href="index.html"]').insertAdjacentHTML('beforebegin',
  '<button onclick="sessionStorage.removeItem(\'adminAuth\');window.location.href=\'gallery.html\';" style="background:none;border:1.5px solid rgba(255,255,255,0.35);color:rgba(255,255,255,0.8);padding:7px 16px;border-radius:8px;font-size:0.82rem;cursor:pointer;font-family:inherit;">Logout</button>'
);

/* ---- init ---- */
renderGrid();
</script>
</body>
</html>
